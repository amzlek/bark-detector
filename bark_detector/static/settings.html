<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bark Detector - Settings</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.25rem; }
  h2 { font-size: 1rem; margin-top: 2.5rem; }
  nav a { margin-right: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; vertical-align: middle; }
  th { font-size: 0.75rem; text-transform: uppercase; opacity: 0.7; }
  form { display: grid; grid-template-columns: 160px 1fr; gap: 0.6rem; align-items: center; max-width: 480px; margin-top: 1rem; }
  form label { font-size: 0.85rem; opacity: 0.8; }
  form input, form select { padding: 0.35rem; font: inherit; }
  .actions { grid-column: 2; display: flex; gap: 0.5rem; margin-top: 0.25rem; }
  button { padding: 0.4rem 0.9rem; cursor: pointer; }
  button.secondary { background: none; }
  button.danger { color: #c0392b; }
  .row-actions button { font-size: 0.8rem; padding: 0.2rem 0.5rem; }
  .empty { opacity: 0.6; padding: 1rem 0; }
  .status { font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
  .status.ok { color: #2a9d3f; }
  .status.err { color: #c0392b; }
  .badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
  .badge::before { content: ''; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #999; }
  .badge.connected::before { background: #2a9d3f; }
  .badge.connecting::before { background: #d4a017; }
  .badge.disconnected::before { background: #c0392b; }
  dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; max-width: 420px; }
  dl.stats dt { opacity: 0.7; }
  dl.stats dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<nav><a href="/">Event Log</a><a href="/settings"><strong>Settings</strong></a></nav>
<h1>Bark Detector - Settings</h1>

<h2>Sources</h2>
<table>
  <thead>
    <tr><th>Name</th><th>Type</th><th>Path</th><th>Listen</th><th>Threshold</th><th>Status</th><th></th></tr>
  </thead>
  <tbody id="sources"></tbody>
</table>
<p id="sources-empty" class="empty" hidden>No sources configured yet.</p>

<form id="source-form">
  <input type="hidden" id="src-original-name">

  <label for="src-name">Name</label>
  <input id="src-name" required placeholder="backyard">

  <label for="src-type">Type</label>
  <select id="src-type">
    <option value="rtsp">rtsp (camera audio track)</option>
    <option value="device">device (USB/ALSA mic)</option>
  </select>

  <label for="src-path">Path</label>
  <input id="src-path" required placeholder="rtsp://user:pass@host/stream1  or  hw:1,0">

  <label for="src-listen">Listen for (comma-separated)</label>
  <input id="src-listen" value="bark, bow-wow, howl, yip">

  <label for="src-threshold">Detection threshold</label>
  <input id="src-threshold" type="number" min="0" max="1" step="0.01" value="0.8">

  <label for="src-min-volume">Min volume (RMS)</label>
  <input id="src-min-volume" type="number" min="0" step="1" value="500">

  <label for="src-pre">Pre-capture (s)</label>
  <input id="src-pre" type="number" min="0" step="0.5" value="5">

  <label for="src-post">Post-capture (s)</label>
  <input id="src-post" type="number" min="0" step="0.5" value="5">

  <div class="actions">
    <button type="submit" id="src-submit">Add source</button>
    <button type="button" class="secondary" id="src-test">Test</button>
    <button type="button" class="secondary" id="src-cancel" hidden>Cancel</button>
  </div>
</form>
<p id="source-status" class="status"></p>

<h2>MQTT broker</h2>
<form id="mqtt-form">
  <label for="mqtt-enabled">Enabled</label>
  <input id="mqtt-enabled" type="checkbox" checked style="justify-self: start;">

  <label for="mqtt-host">Host</label>
  <input id="mqtt-host" required placeholder="mqtt.local">

  <label for="mqtt-port">Port</label>
  <input id="mqtt-port" type="number" value="1883">

  <label for="mqtt-username">Username</label>
  <input id="mqtt-username">

  <label for="mqtt-password">Password</label>
  <input id="mqtt-password" type="password">

  <label for="mqtt-topic">Topic prefix</label>
  <input id="mqtt-topic" value="bark_detector" placeholder="bark_detector">

  <label for="mqtt-client-id">Client ID</label>
  <input id="mqtt-client-id" value="bark_detector">

  <div class="actions">
    <button type="submit">Save MQTT settings</button>
  </div>
</form>
<p id="mqtt-status" class="status"></p>

<h2>Storage</h2>
<dl class="stats">
  <dt>Recordings</dt><dd id="stat-recordings">-</dd>
  <dt>Space used</dt><dd id="stat-used">-</dd>
  <dt>Space available on disk</dt><dd id="stat-available">-</dd>
</dl>

<script>
const sourceForm = document.getElementById('source-form');
const sourceStatus = document.getElementById('source-status');
const cancelBtn = document.getElementById('src-cancel');
const submitBtn = document.getElementById('src-submit');

function showStatus(el, message, ok) {
  el.textContent = message;
  el.className = 'status ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { el.textContent = ''; }, 4000);
}

function resetSourceForm() {
  sourceForm.reset();
  document.getElementById('src-original-name').value = '';
  document.getElementById('src-listen').value = 'bark, bow-wow, howl, yip';
  document.getElementById('src-threshold').value = '0.8';
  document.getElementById('src-min-volume').value = '500';
  document.getElementById('src-pre').value = '5';
  document.getElementById('src-post').value = '5';
  submitBtn.textContent = 'Add source';
  cancelBtn.hidden = true;
}

function fillSourceForm(source) {
  document.getElementById('src-original-name').value = source.name;
  document.getElementById('src-name').value = source.name;
  document.getElementById('src-type').value = source.type;
  document.getElementById('src-path').value = source.path;
  document.getElementById('src-listen').value = source.listen.join(', ');
  const thresholds = Object.values(source.thresholds || {});
  document.getElementById('src-threshold').value = thresholds.length ? thresholds[0] : 0.8;
  document.getElementById('src-min-volume').value = source.min_volume;
  document.getElementById('src-pre').value = source.pre_capture;
  document.getElementById('src-post').value = source.post_capture;
  submitBtn.textContent = 'Save changes';
  cancelBtn.hidden = false;
  window.scrollTo({ top: sourceForm.offsetTop - 20, behavior: 'smooth' });
}

async function loadSources() {
  const res = await fetch('/api/sources');
  const sources = await res.json();
  const tbody = document.getElementById('sources');
  const empty = document.getElementById('sources-empty');

  tbody.innerHTML = '';
  empty.hidden = sources.length > 0;

  for (const source of sources) {
    const tr = document.createElement('tr');
    const threshold = Object.values(source.thresholds || {})[0] ?? '-';
    const status = source.status || 'connecting';
    tr.innerHTML = `
      <td>${source.name}</td>
      <td>${source.type}</td>
      <td>${source.path}</td>
      <td>${source.listen.join(', ')}</td>
      <td>${threshold}</td>
      <td><span class="badge ${status}">${status}</span></td>
      <td class="row-actions">
        <button type="button" data-action="edit">Edit</button>
        <button type="button" data-action="delete" class="danger">Delete</button>
      </td>
    `;
    tr.querySelector('[data-action="edit"]').onclick = () => fillSourceForm(source);
    tr.querySelector('[data-action="delete"]').onclick = async () => {
      if (!confirm(`Delete source "${source.name}"?`)) return;
      const res = await fetch(`/api/sources/${encodeURIComponent(source.name)}`, { method: 'DELETE' });
      if (res.ok) { await loadSources(); } else { showStatus(sourceStatus, await errorText(res), false); }
    };
    tbody.appendChild(tr);
  }
}

async function errorText(res) {
  try { return (await res.json()).error || res.statusText; } catch { return res.statusText; }
}

sourceForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const originalName = document.getElementById('src-original-name').value;
  const listen = document.getElementById('src-listen').value
    .split(',').map(s => s.trim()).filter(Boolean);
  const threshold = parseFloat(document.getElementById('src-threshold').value);
  const thresholds = {};
  for (const label of listen) thresholds[label] = threshold;

  const body = {
    name: document.getElementById('src-name').value.trim(),
    type: document.getElementById('src-type').value,
    path: document.getElementById('src-path').value.trim(),
    listen,
    thresholds,
    min_volume: parseFloat(document.getElementById('src-min-volume').value),
    pre_capture: parseFloat(document.getElementById('src-pre').value),
    post_capture: parseFloat(document.getElementById('src-post').value),
  };

  const url = originalName ? `/api/sources/${encodeURIComponent(originalName)}` : '/api/sources';
  const method = originalName ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (res.ok) {
    showStatus(sourceStatus, 'Saved.', true);
    resetSourceForm();
    await loadSources();
  } else {
    showStatus(sourceStatus, await errorText(res), false);
  }
});

cancelBtn.addEventListener('click', resetSourceForm);

document.getElementById('src-test').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('src-name').value.trim() || 'test',
    type: document.getElementById('src-type').value,
    path: document.getElementById('src-path').value.trim(),
  };

  if (!body.path) {
    showStatus(sourceStatus, 'Enter a path first.', false);
    return;
  }

  sourceStatus.textContent = 'Testing...';
  sourceStatus.className = 'status';
  const res = await fetch('/api/sources/test', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const result = await res.json();
  showStatus(sourceStatus, result.message, res.ok);
});

const mqttForm = document.getElementById('mqtt-form');
const mqttStatus = document.getElementById('mqtt-status');

async function loadMqtt() {
  const res = await fetch('/api/mqtt');
  const mqtt = await res.json();
  document.getElementById('mqtt-enabled').checked = mqtt.enabled !== false;
  document.getElementById('mqtt-host').value = mqtt.host || '';
  document.getElementById('mqtt-port').value = mqtt.port || 1883;
  document.getElementById('mqtt-username').value = mqtt.username || '';
  document.getElementById('mqtt-password').value = mqtt.password || '';
  document.getElementById('mqtt-topic').value = mqtt.topic || 'bark_detector';
  document.getElementById('mqtt-client-id').value = mqtt.client_id || 'bark_detector';
}

mqttForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    enabled: document.getElementById('mqtt-enabled').checked,
    host: document.getElementById('mqtt-host').value.trim(),
    port: parseInt(document.getElementById('mqtt-port').value, 10),
    username: document.getElementById('mqtt-username').value.trim() || null,
    password: document.getElementById('mqtt-password').value || null,
    topic: document.getElementById('mqtt-topic').value.trim(),
    client_id: document.getElementById('mqtt-client-id').value.trim(),
  };

  const res = await fetch('/api/mqtt', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (res.ok) {
    showStatus(mqttStatus, 'Saved and reconnected.', true);
  } else {
    showStatus(mqttStatus, await errorText(res), false);
  }
});

function formatBytes(bytes) {
  if (bytes === null || bytes === undefined) return 'unknown';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let value = bytes, i = 0;
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
  return `${value.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

async function loadStats() {
  const res = await fetch('/api/stats');
  if (!res.ok) return;
  const stats = await res.json();
  document.getElementById('stat-recordings').textContent = stats.recordings;
  document.getElementById('stat-used').textContent = formatBytes(stats.space_used_bytes);
  document.getElementById('stat-available').textContent = formatBytes(stats.space_available_bytes);
}

loadSources();
loadMqtt();
loadStats();
setInterval(loadSources, 5000);
setInterval(loadStats, 15000);
</script>
</body>
</html>
