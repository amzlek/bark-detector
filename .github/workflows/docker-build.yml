name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read version from pyproject.toml
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open('pyproject.toml', 'rb') as project_file:
              version = tomllib.load(project_file)['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit(f'Expected a major.minor.patch version, got {version!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
          PY

      - name: Check whether this version was released
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Version $tag is already tagged; skipping publication."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag."
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the published commit
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
