[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bark-detector"
version = "1.1.2"
description = "Audio bark detection service with MQTT notifications"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "ai-edge-litert>=2.0,<3",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "paho-mqtt>=2.1,<3",
    "Flask>=3.0,<4",
    "flask-sock>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["bark_detector*"]

[tool.setuptools.package-data]
bark_detector = ["templates/*.html", "static/*.css", "static/*.js"]
