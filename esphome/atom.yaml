substitutions:
  name: mic
  friendly_name: Microphone
  stream_port: "12345"
  beep_frequency_hz: "1000"
  beep_duration_ms: "300"

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  includes:
    - tcp_audio_server.h
    - beep_tone.h

esp32:
  board: m5stack-atom
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret encrypt_key

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  on_connect:
    - lambda: |-
        audio_server::init(${stream_port});
    - switch.turn_on: recording_switch

  on_disconnect:
    - light.turn_on:
        id: led
        red: 50%
        green: 0%
        blue: 0%
        brightness: 40%
        effect: "Asymmetrical Pulse"

  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Edit with you IP or use DHCP - See EspHome documentation
  manual_ip:
    static_ip: 192.168.1.121 
    gateway: 192.168.1.1
    subnet: 255.255.255.0

button:
  - platform: template
    name: Beep
    on_press:
      - microphone.stop_capture: echo_microphone
      - delay: 300ms
      - lambda: |-
          id(echo_speaker)->start();
      - delay: 100ms
      - lambda: |-
          beep_tone::play_tone(id(echo_speaker), ${beep_frequency_hz}, ${beep_duration_ms});
      - wait_until:
          condition:
            not:
              - speaker.is_playing:
          timeout: 10s
      - if:
          condition:
            switch.is_on: recording_switch
          then:
            - microphone.capture: echo_microphone

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: Button
    disabled_by_default: true
    entity_category: diagnostic
    id: echo_button
    on_multi_click:
      - timing:
          - ON for at most 1s
        then:
          - switch.toggle: recording_switch
  - platform: template
    name: Client connected
    entity_category: diagnostic
    device_class: connectivity
    lambda: |-
      return audio_server::has_client();

switch:
  - platform: template
    name: Recording
    id: recording_switch
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      - if:
          condition:
            not:
              - microphone.is_capturing:
          then:
            - microphone.capture: echo_microphone
      - light.turn_on:
          id: led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 40%
          effect: "Asymmetrical Pulse"
    on_turn_off:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - microphone.stop_capture: echo_microphone
      - light.turn_on:
          id: led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 40%
          effect: none

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: None
    disabled_by_default: true
    entity_category: config
    pin: GPIO27
    default_transition_length: 0s
    chipset: SK6812
    num_leds: 1
    rgb_order: grb
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 2s
      - pulse:
          name: "Asymmetrical Pulse"
          transition_length:
            on_length: 1s
            off_length: 500ms
          update_interval: 1.5s

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true
    on_data:
      - lambda: |-
          audio_server::poll_accept();
          audio_server::send(x);

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: stereo  # The Echo has poor playback audio quality when using mono audio
    buffer_duration: 60ms
