services:
  bark-detector:
    image: bark-detector:latest
    build: .
    restart: unless-stopped
    # needed for USB mic / ALSA device sources; omit if only using rtsp sources
    devices:
      - /dev/snd:/dev/snd
    ports:
      - "8099:8099"
    volumes:
      # a directory, not a single file: if ./config/config.yaml doesn't
      # exist yet, Docker would otherwise create a *directory* there
      # instead of letting the app create the file, which breaks the
      # zero-config self-heal on first boot. The app writes config.yaml
      # inside this directory itself (and keeps it updated whenever you
      # add/edit/delete a source or change MQTT settings via the UI).
      - ./config:/config
      - ./snippets:/media/bark_snippets
