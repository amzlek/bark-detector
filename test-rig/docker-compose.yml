# Local end-to-end test rig: a real MQTT broker + a real RTSP stream + a
# raw-PCM TCP stream (emulating an M5 Atom Echo), both looping dataset/*.wav,
# so bark-detector runs its actual detection pipeline (ffmpeg/socket pull ->
# TFLite classify -> snippet -> MQTT publish) against known labeled audio
# instead of real hardware.
#
# dataset/ isn't committed. You don't need to fetch it yourself though -
# stream-publisher downloads it into the bind-mounted ./dataset on first
# start (see stream/entrypoint.sh) and reuses it on every run after that.
#
# Run from this directory:
#   docker compose up --build
#
# Then:
#   - watch detections:  mosquitto_sub -h localhost -t 'bark_detector/#'
#   - browse the event log / settings UI: http://localhost:8099
#   - ground truth is in the filenames: NN_bark.wav / NN_negative.wav
#
# Optional env vars for stream-publisher (set before `docker compose up`):
#   BARK_COUNT, NEGATIVE_COUNT  - sample counts (default 5 each)
#   FORCE_REFETCH=true          - re-download even if ./dataset already has samples
#
# bark-detector waits for stream-publisher to report healthy (ffmpeg still
# alive a few seconds after connecting to mediamtx - see publish.sh) -
# otherwise it'd spend the whole download+playlist-build phase churning
# through failed connection attempts for nothing. (mediamtx's own status
# API would be the more direct signal, but it requires auth for anything
# but localhost by default and isn't worth fighting for a test rig.)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"

  stream-publisher:
    build:
      context: .
      dockerfile: stream/Dockerfile
    environment:
      MEDIAMTX_HOST: mediamtx
      STREAM_PATH: backyard
      BARK_COUNT: ${BARK_COUNT:-5}
      NEGATIVE_COUNT: ${NEGATIVE_COUNT:-5}
      FORCE_REFETCH: ${FORCE_REFETCH:-false}
    volumes:
      - ./dataset:/data
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/streaming_ready"]
      interval: 3s
      timeout: 3s
      # generous: covers the dataset download + playlist build, which can
      # take a couple minutes depending on network speed and how many
      # AudioSet YouTube ids are dead. Failures during this window don't
      # count against `retries`.
      start_period: 240s
      retries: 5

  # emulates an M5 Atom Echo running esphome/tcp_audio_server.h: serves the
  # same labeled dataset as stream-publisher, but as raw PCM over a
  # listening TCP socket (bark-detector's `esphome_tcp` source type)
  # instead of RTSP. Depends on stream-publisher being healthy purely to
  # reuse the playlist.txt/silence.wav it builds under the shared ./dataset
  # mount - see atom/entrypoint.sh.
  atom:
    build:
      context: .
      dockerfile: atom/Dockerfile
    environment:
      STREAM_PORT: 12345
    volumes:
      - ./dataset:/data:ro
    depends_on:
      stream-publisher:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/streaming_ready"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 5
    ports:
      - "12345:12345"

  bark-detector:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      mosquitto:
        condition: service_started
      stream-publisher:
        condition: service_healthy
      atom:
        condition: service_healthy
    volumes:
      - ./config.yaml:/config/config.yaml
      # ro: these are committed fixtures, not scratch state - bark-detector
      # rewrites a source's file on its first load if it predates a schema
      # addition (e.g. the "id" field), which would otherwise dirty the
      # working tree on every test run. Add/edit/delete-source and other
      # settings-UI-driven writes will fail against a read-only mount -
      # drop :ro locally if you need to exercise those against the rig.
      - ./sources:/config/sources:ro
      - ./snippets:/media/bark_snippets
    ports:
      - "8099:8099"
