# This whole file is optional - a missing/empty/partial config.yaml just
# runs with defaults (zero sources, web UI on, MQTT off) instead of
# failing, and gets self-healed into a fully-populated file on disk. See
# README.md for the zero-config quick start. This file shows every field
# spelled out for when you do want to hand-configure something.
#
# Every field below can also be overridden by an env var, which always
# wins over whatever's in this file (MQTT_ENABLED, MQTT_HOST, MQTT_PORT,
# MQTT_USERNAME, MQTT_PASSWORD, MQTT_TOPIC, MQTT_CLIENT_ID). Same for
# web.* (WEB_ENABLED/WEB_HOST/WEB_PORT), cleanup.* (CLEANUP_MAX_AGE_DAYS/
# CLEANUP_MAX_SPACE_MB/CLEANUP_CHECK_INTERVAL_MINUTES), and snippet_dir/
# ffmpeg_path/log_level (SNIPPET_DIR/FFMPEG_PATH/LOG_LEVEL).
mqtt:
  # defaults to false if omitted - this example turns it on since it's
  # showing a complete, working setup
  enabled: true
  host: mqtt.local
  port: 1883
  username: bark_detector
  password: changeme
  # base prefix - event/status/system topics are all derived from it:
  #   {topic}/{source}/event    (a detection fires)
  #   {topic}/{source}/status   (a source connects/disconnects; retained)
  #   {topic}/system/{event}    (e.g. space_limit_reached on cleanup)
  topic: bark_detector

# where saved WAV snippets are written (mount this as a volume for 
# persistence or so other tools can read the files)
snippet_dir: /media/bark_snippets

log_level: INFO

# event log + settings UI (add/edit/delete sources, change MQTT settings)
web:
  enabled: true
  host: 0.0.0.0
  port: 8099

# global retention for saved snippets - checked every check_interval_minutes.
# age-based cleanup runs first, then space-based (oldest-first) if still over
# max_space_mb; a space-triggered purge also publishes an MQTT notification
# (see 'MQTT topics' in README.md). set either limit to null to disable it.
cleanup:
  max_age_days: 30
  max_space_mb: 1000
  check_interval_minutes: 15

# defaults applied to every source unless overridden per-source below.
# note: this only applies to sources loaded from this file as-is. once you
# add/edit/delete anything through the settings UI, the whole file gets
# rewritten with every source fully spelled out and this 'defaults' block
# removed - hand-edit the file again afterwards if you want it back.
defaults:
  listen: [bark, bow-wow, howl, yip]
  min_volume: 500
  pre_capture: 5
  post_capture: 5
  thresholds:
    bark: 0.8

sources:
  # a camera's RTSP stream that includes an audio track
  - name: backyard
    type: rtsp
    path: rtsp://user:pass@192.168.1.50:554/stream1

  # a USB microphone attached to the host running this container
  # find the device name with `arecord -l` (Linux) - format is hw:<card>,<device>
  - name: garage_mic
    type: device
    path: hw:1,0
    pre_capture: 3
    post_capture: 3

  # M5 Atom Echo / other Wyoming-protocol satellites are not supported yet
  # - name: living_room
  #   type: wyoming
  #   path: 192.168.1.60:10700
